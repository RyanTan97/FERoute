<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <h1>Admin Panel</h1>
    </div>
    <form id="upload-form">
        <input type="text" id="route-name" placeholder="Route Name" required>
        <input type="text" id="route-time" placeholder="Estimated Time" required>
        <input type="text" id="route-difficulty" placeholder="Difficulty Level" required>
        <input type="file" id="route-file" required>
        <button type="submit">Add Route</button>
    </form>
    <div id="routes-container" class="routes-container"></div>
    <script src="script.js"></script>
</body>
</html>
